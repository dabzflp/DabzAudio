<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Choose your country | DabzAudio Lyric Book</title>
  <script src="../assets/js/theme.js"></script>
  <script src="../assets/js/dialog.js"></script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="../assets/css/dabz-glass.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="stylesheet" href="../assets/css/product-skin.css" />
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
</head>
<body class="auth-bg dabz-lite">
  <header class="site-header">
    <a class="brand" href="../index.html" style="text-decoration:none">
      <span class="dabz-brand"><span class="sitename" role="img" aria-label="DA">D&Lambda;</span><span class="dot">.</span></span>
      <div class="brand-text"><small>Lyric Book</small></div>
    </a>
  </header>
  <main class="auth-wrap">
    <form class="auth-card" id="countryForm" novalidate style="max-width:460px">
      <h1>Choose your country</h1>
      <p class="sub">We use this to show the right payment options for your account.</p>
      <div class="field">
        <label for="countryCode">Country</label>
        <select id="countryCode" autocomplete="country-name" required>
          <option value="">Loading countries…</option>
        </select>
      </div>
      <p class="sub" id="providerNote" aria-live="polite">Nigeria uses Paystack. Other countries use Stripe.</p>
      <button class="btn block" type="submit" id="continueBtn">Save country and continue</button>
      <div class="msg" id="countryMsg" role="status"></div>
    </form>
  </main>
  <script src="js/country.js"></script>
</body>
</html>
