<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Playback | DabzAudio Lyric Book</title>
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="../assets/css/dabz-glass.css" />
  <link rel="stylesheet" href="../assets/css/theme.css" />
  <link rel="icon" type="image/png" href="../assets/img/dabzaudiobck.png" />
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
</head>
<body class="dabz-lite playback-body">
  <header class="site-header">
    <div class="brand">
      <a class="logo-circle playback-logo" href="app.html" aria-label="Back to Lyric Book">DA</a>
      <a class="brand-text" href="app.html" style="text-decoration:none"><b>DabzAudio</b><small>Playback</small></a>
    </div>
    <a class="btn subtle small" href="app.html">Back to Lyric Book</a>
  </header>

  <main class="playback-page" id="playbackPage">
    <section class="playback-hero">
      <div>
        <p class="playback-kicker">YOUR MUSIC LIBRARY</p>
        <h1>Playback</h1>
        <p class="sub">Keep singles and albums together, then share a clean listening link with anyone.</p>
      </div>
      <button class="btn" id="newReleaseBtn" type="button">+ New release</button>
    </section>

    <section class="playback-create" id="createPanel" hidden>
      <div class="playback-panel-head"><h2>Start a release</h2><button class="modal-close" id="createClose" type="button" aria-label="Close">&times;</button></div>
      <form id="releaseForm" class="playback-form">
        <label>Release title<input id="releaseTitle" maxlength="160" placeholder="Midnight singles" required /></label>
        <label>Format<select id="releaseType"><option value="single">Single</option><option value="album">Album</option></select></label>
        <label class="full">Description <span class="optional">optional</span><textarea id="releaseDescription" maxlength="1000" placeholder="A short note about this release"></textarea></label>
        <div class="playback-form-actions full"><button class="btn" type="submit">Create release</button><span class="msg" id="createMsg"></span></div>
      </form>
    </section>

    <div class="msg" id="pageMsg"></div>
    <section class="release-grid" id="releaseList"></section>
  </main>

  <template id="releaseTemplate">
    <article class="release-card">
      <div class="release-art"><img alt="" /><span class="release-art-mark">♪</span></div>
      <div class="release-content">
        <div class="release-heading"><div><span class="release-type"></span><h2 class="release-title"></h2></div><div class="release-card-actions"><button class="btn subtle small share-btn" type="button">Share</button><button class="btn danger small delete-release" type="button">Delete</button></div></div>
        <p class="release-description"></p>
        <div class="cover-row"><label class="btn ghost small">Cover art<input class="cover-input" type="file" accept="image/jpeg,image/png,image/webp" hidden /></label><span class="cover-note">JPG, PNG or WebP · 5 MB max</span></div>
        <form class="track-form"><label class="btn small">Add track<input class="track-input" type="file" accept="audio/mpeg,audio/wav,audio/ogg,audio/flac,audio/mp4,audio/aac,audio/x-m4a" hidden /></label><input class="track-title" maxlength="160" placeholder="Track title (optional)" /><span class="track-note">MP3, WAV, FLAC and more · 25 MB max</span></form>
        <ol class="track-list"></ol>
        <div class="release-share" hidden><input readonly /><button class="btn ghost small copy-btn" type="button">Copy link</button></div>
      </div>
    </article>
  </template>

  <script src="js/playback.js"></script>
</body>
</html>
