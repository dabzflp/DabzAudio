<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DabzAudio Music ID Verification</title>
    <link rel="stylesheet" href="/public/css/registry.css">
</head>
<body>
    <main class="verify-shell">
        <section class="verify-card" id="verifyCard">
            <div class="verify-loader">VERIFYING MUSIC ID...</div>
        </section>
    </main>

    <script>
        async function loadMusic() {
            const musicId = window.location.pathname.split("/").pop();
            const card = document.getElementById("verifyCard");

            try {
                const response = await fetch("/api/registry/" + encodeURIComponent(musicId));
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Music ID not found.");
                }

                const music = data.music;

                card.innerHTML = `
                    <div class="verify-top">
                        <div class="brand-mark">D</div>
                        <span class="verified-badge">✓ VERIFIED RECORD</span>
                    </div>

                    <p class="eyebrow">DABZAUDIO MUSIC ID</p>
                    <h1>${escapeHtml(music.title)}</h1>
                    <p class="artist">${escapeHtml(music.artist)}</p>

                    <div class="identity-code">${escapeHtml(music.musicId)}</div>

                    <div class="verification-grid">
                        <div>
                            <span>Audio fingerprint</span>
                            <strong>${escapeHtml(music.audioHash.slice(0, 18))}…</strong>
                        </div>
                        <div>
                            <span>Registry status</span>
                            <strong>VERIFIED</strong>
                        </div>
                        <div>
                            <span>Blockchain</span>
                            <strong>${music.blockchain && music.blockchain.status === "confirmed" ? "ANCHORED" : "PENDING"}</strong>
                        </div>
                        <div>
                            <span>Registered</span>
                            <strong>${new Date(music.createdAt).toLocaleDateString()}</strong>
                        </div>
                    </div>

                    <div class="ownership-box">
                        <p class="eyebrow">CONTRIBUTORS & SPLITS</p>
                        ${
                            music.ownership && music.ownership.length
                            ? music.ownership.map(function (owner) {
                                return `<div class="owner-row">
                                    <span>${escapeHtml(owner.name || "Contributor")}</span>
                                    <strong>${escapeHtml(String(owner.percentage || 0))}%</strong>
                                </div>`;
                            }).join("")
                            : "<p class='muted'>Ownership metadata has not been published for this record.</p>"
                        }
                    </div>

                    <div class="hash-box">
                        <span>SHA-256 AUDIO FINGERPRINT</span>
                        <code>${escapeHtml(music.audioHash)}</code>
                    </div>

                    <p class="disclaimer">
                        DabzAudio Music ID is a technical verification record. A blockchain record alone does not determine legal copyright ownership.
                    </p>
                `;
            } catch (error) {
                card.innerHTML = `
                    <div class="error-state">
                        <div class="brand-mark">D</div>
                        <p class="eyebrow">DABZAUDIO MUSIC ID</p>
                        <h1>Record not found</h1>
                        <p>${escapeHtml(error.message)}</p>
                    </div>
                `;
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        loadMusic();
    </script>
</body>
</html>
